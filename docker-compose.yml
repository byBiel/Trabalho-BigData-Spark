services:
  api:
    build:
      context: ./Backend-BigData
    container_name: bigdata-api
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend-BigData
    container_name: bigdata-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped